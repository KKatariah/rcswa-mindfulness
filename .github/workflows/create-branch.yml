name: Create branch for new issues

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-issue-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Create and link branch from issue (with fallback)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // sanitize title for branch name
            const slug = issue.title
              .toLowerCase()
              .replace(/[^a-z0-9\s-]/g, "")
              .trim()
              .replace(/\s+/g, "-")
              .replace(/-+/g, "-")
              .slice(0, 50);

            const branchName = `issue-${issue.number}-${slug || "untitled"}`;

            // get default branch
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const baseBranch = repoData.default_branch;

            // 1) Preferred path: create linked branch via issue endpoint
            try {
              await github.request("POST /repos/{owner}/{repo}/issues/{issue_number}/create-branch", {
                owner,
                repo,
                issue_number: issue.number,
                name: branchName
              });

              core.info(`Created linked branch via issue endpoint: ${branchName}`);
              return;
            } catch (err) {
              core.warning(
                `Issue create-branch endpoint unavailable/failed (${err.status || "unknown"}). Falling back to git ref creation.`
              );
            }

            // 2) Fallback path: create ref directly from default branch HEAD
            const { data: refData } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${baseBranch}`
            });

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: refData.object.sha
              });

              core.info(`Created branch via fallback: ${branchName}`);
            } catch (err) {
              // If branch already exists, don't fail the workflow
              if (err.status === 422) {
                core.info(`Branch already exists: ${branchName}`);
              } else {
                throw err;
              }
            }
