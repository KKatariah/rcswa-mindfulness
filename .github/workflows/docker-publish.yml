name: Publish Docker images

# On every merge to main: run the full backend and frontend checks, then build both
# images and push them to GitHub Container Registry (ghcr.io). The server's Watchtower
# container picks up the new :latest within a few minutes (DEPLOYMENT.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer merge supersedes one still publishing.
concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  backend-checks:
    uses: ./.github/workflows/ci-backend.yml

  frontend-checks:
    uses: ./.github/workflows/ci-frontend.yml

  publish:
    name: Build and push ${{ matrix.image }}
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: web
            context: client
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          echo "tags=${repo}:latest,${repo}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Public values baked into the frontend; set under Settings → Secrets and variables → Actions → Variables.
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
