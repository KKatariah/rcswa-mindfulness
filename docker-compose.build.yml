# Builds the images from this checkout instead of pulling them from GHCR.
# For testing locally, or if the registry is unavailable:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
# Watchtower is left out so it can't replace the local builds.
services:
  api:
    image: mindfulness-api:local
    build: .
  cron:
    image: mindfulness-api:local
  web:
    image: mindfulness-web:local
    build:
      context: client
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
  watchtower:
    profiles: ["never"]
